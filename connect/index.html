<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Suntropy Connect</title>
<!-- Redirección a la web de Suntropy Connect (despliegue independiente) -->
<meta http-equiv="refresh" content="0; url=https://connect.suntropy.ai">
<link rel="canonical" href="https://connect.suntropy.ai">
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    background:#1D1C45;color:#fff;text-align:center;padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  img{height:30px;width:auto}
  .spin{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.16);
    border-top-color:#E75679;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  p{margin:0;font-size:15px;color:rgba(255,255,255,.72)}
  a{color:#fff;font-weight:600}
  a.cta{
    display:inline-block;margin-top:4px;padding:10px 20px;border-radius:999px;
    background:linear-gradient(96deg,#7D6CF6,#E75679);text-decoration:none;font-size:14.5px;
  }
</style>
</head>
<body>
  <img src="../assets/suntropy-ai.svg" alt="Suntropy AI">
  <div class="spin" aria-hidden="true"></div>
  <p>Te llevamos a <strong>Suntropy&nbsp;Connect</strong>…</p>
  <a class="cta" href="https://connect.suntropy.ai">Ir a Suntropy Connect</a>
  <script>
    // Redirección inmediata (respaldo al meta-refresh); replace() para no dejarla en el historial.
    location.replace("https://connect.suntropy.ai");
  </script>
</body>
</html>
